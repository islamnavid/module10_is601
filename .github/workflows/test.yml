
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright/python:v1.48.0-noble

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mytestdb
        options: >-
          --health-cmd "pg_isready -U user -d mytestdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://user:password@postgres:5432/mytestdb
      PYTHONPATH: ${{ github.workspace }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v

      - name: Start FastAPI server
        run: |
          python -m uvicorn main:app \
            --host 0.0.0.0 \
            --port 8000 > /tmp/fastapi.log 2>&1 &

          echo $! > /tmp/fastapi.pid

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "FastAPI server is ready"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/fastapi.pid)" 2>/dev/null; then
              cat /tmp/fastapi.log
              exit 1
            fi

            sleep 1
          done

          cat /tmp/fastapi.log
          exit 1

      - name: Run E2E tests
        run: |
          python -m pytest tests/e2e/ -v

      - name: Show server logs on failure
        if: failure()
        run: |
          cat /tmp/fastapi.log || true

  security:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t app:test .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy:
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/module10_is601:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/module10_is601:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
